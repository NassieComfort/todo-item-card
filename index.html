 <!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo Item Card</title>
    <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <!-- Card root -> data-testid="test-todo-card" -->
     <article class="todo-card" data-testid="test-todo-card" aria-label="Todo item card">
      <div class="header-row">
        <!-- Checkbox -> data-testid="test-todo-complete-toggle" -->
        <div class="left-check">
          <input
            id="todo-complete"
            data-testid="test-todo-complete-toggle"
            type="checkbox"
            aria-label="Mark todo complete"
          />
          <label for="todo-complete" class="sr-only">
            Mark todo complete
          </label>
        </div>

        <div class="title-block">
          <!-- Title -> data-testid="test-todo-title" -->
          <h3 data-testid="test-todo-title" class="todo-title">Design onboarding flow</h3>

          <!-- Description -> data-testid="test-todo-description" -->
          <p data-testid="test-todo-description" class="todo-description">
            Polish the first-run experience: clear steps, empty states, and a smooth completion moment.
          </p>
        </div>

        <div class="actions">
          <!-- Edit button -> data-testid="test-todo-edit-button" -->
          <button
            class="icon-btn"
            type="button"
            data-testid="test-todo-edit-button"
            aria-label="Edit todo"
            title="Edit"
          >
            ✏️
          </button>

          <!-- Delete button -> data-testid="test-todo-delete-button" -->
          <button
            class="icon-btn"
            type="button"
            data-testid="test-todo-delete-button"
            aria-label="Delete todo"
            title="Delete"
          >
            🗑️
          </button>
        </div>
      </div>

      <div class="meta-grid">
        <!-- Priority badge -> data-testid="test-todo-priority" -->
        <div class="meta-box priority-box" id="priorityBox">
          <div class="meta-label">Priority</div>
          <div
            class="priority-badge"
            data-testid="test-todo-priority"
            id="priorityBadge"
          >
            High
          </div>
        </div>

        <!-- Due date -> data-testid="test-todo-due-date" -->
        <div class="meta-box">
          <div class="meta-label">Due date</div>
          <time data-testid="test-todo-due-date" id="dueTime"></time>
        </div>

        <!-- Time remaining -> data-testid="test-todo-time-remaining" -->
        <div class="meta-box time-box" id="timeBox">
          <div class="meta-label">Time remaining</div>
          <div
            data-testid="test-todo-time-remaining"
            id="timeRemaining"
            aria-live="polite"
            class="time-remaining"
          >
            —
          </div>
        </div>
      </div>

      <div class="status-row">
        <!-- Status indicator -> data-testid="test-todo-status" -->
        <div class="status-box">
          <div class="meta-label">Status</div>
          <div
            id="statusBadge"
            data-testid="test-todo-status"
            class="status-badge"
          >
            In progress
          </div>
        </div>

        <!-- Categories list -> data-testid="test-todo-tags" -->
        <div class="categories-container">
          <div class="meta-label">Categories</div>
          <ul class="tags" role="list" data-testid="test-todo-tags" id="tagList"></ul>
        </div>
      </div>
    </article>

    <!-- Script -->
    <script src="script.js"></script>
  </body>
  </html>
